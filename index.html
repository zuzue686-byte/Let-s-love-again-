<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --secondary-pink: #ff758f;
            --bg-color: #fff5f7; 
            --accent-purple: #9c27b0;
            --deep-purple: #6a1b9a;
            --soft-pink: #ffeef2;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* --- Improved Pro Intro Page --- */
        #intro-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fff5f7 0%, #ffeef2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .intro-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px 30px;
            border-radius: 40px;
            border: 2px solid rgba(255, 77, 109, 0.1);
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.1);
            animation: cardFloat 3s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .intro-content h2 {
            color: var(--primary-pink);
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: -1px;
            animation: fadeInDown 0.8s ease;
        }

        .intro-content p {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease;
        }

        .play-btn {
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--primary-pink), var(--secondary-pink));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: all 0.3s ease;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- End Intro Styling --- */

        .floating-element {
            position: absolute;
            bottom: -100px;
            color: rgba(255, 77, 109, 0.3);  
            user-select: none;
            pointer-events: none;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.12);
            max-width: 450px; 
            width: 85%;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--primary-pink);  
            font-size: 1.8rem;
            margin: 20px 0;
            line-height: 1.4;
        }

        .gif-container {
            width: 100%;
            height: 300px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .gif-container img {
            max-width: 280px; 
            width: 100%;
            height: auto;
            border-radius: 15px;
            object-fit: contain;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.9s ease;
            white-space: nowrap;
        }

        #yes-btn {
            background: linear-gradient(45deg, var(--primary-pink), var(--secondary-pink));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
            z-index: 10;
        }

        #no-btn {
            background-color: #b0bec5;
            color: white;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        #result-section {
            animation: scaleUp 0.5s ease-out;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="intro-page">
        <div class="intro-card">
            <div class="intro-content">
                <h2>Hey Gorgeous! ❤️</h2>
                <p>မမ အတွက် Surprise လေးတစ်ခုရှိတယ်...</p>
                <button class="play-btn" onclick="startApp()">Tap to Open ✨</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="0503.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="question-section">
            <div class="gif-container">
                <img src="F1.gif" alt="Asking Bear">
            </div>
            <h1>ပြန်တွဲကြရအောင်နော်?မမ🥺</h1>
            <div class="buttons">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>

        <div id="result-section" class="hidden">
            <div class="gif-container">
                <img src="G1.gif" alt="Happy Bear">
            </div>
            <h1>ကျေးဇူးပါမမ! မ မရှိဘဲမဖြစ်လို့ပါ ❤️</h1>
            <p style="font-size: 1.1rem; color: #555; margin-top: 10px;">🙌🏻စိတ်ဆိုးပြေပါတော့နော်🙌🏻 <br> 💝 အများကြီးချစ်တယ်နော် အာဘွား💝</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionSection = document.getElementById('question-section');
        const resultSection = document.getElementById('result-section');
        const music = document.getElementById('bg-music');
        const introPage = document.getElementById('intro-page');

        function startApp() {
            music.play();
            introPage.style.opacity = '0';
            introPage.style.transform = 'scale(1.2)';
            setTimeout(() => {
                introPage.classList.add('hidden');
            }, 800);
        }

        function createFloatingElement() {
            const element = document.createElement('div');
            element.classList.add('floating-element');
            element.innerHTML = '💖'; 
            element.style.left = Math.random() * 100 + 'vw';
            element.style.animationDuration = Math.random() * 3 + 4 + 's';
            element.style.fontSize = Math.random() * 15 + 10 + 'px';
            
            document.body.appendChild(element);

            setTimeout(() => {
                element.remove();
            }, 6000);
        }

        setInterval(createFloatingElement, 400);

        yesBtn.addEventListener('click', () => {
            questionSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
        });

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });
    </script>

</body>
</html>
